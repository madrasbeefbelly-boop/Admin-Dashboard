<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f8fafc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect x="12" y="12" width="376" height="376" rx="20" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.3"/>

  <!-- Icon Container Card -->
  <g filter="url(#shadow)">
    <rect x="145" y="130" width="110" height="110" rx="24" fill="#ffffff"/>
  </g>

  <!-- Utensils & Plate Icon -->
  <g transform="translate(170, 155)" stroke="#dc2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Plate circle -->
    <circle cx="30" cy="30" r="26" stroke="#fca5a5" stroke-width="2"/>
    <circle cx="30" cy="30" r="18" stroke="#ef4444" stroke-dasharray="2 4" stroke-width="1.5"/>

    <!-- Fork & Knife crossed -->
    <path d="M18 18 L42 42" stroke="#dc2626" stroke-width="2.5"/>
    <path d="M42 18 L18 42" stroke="#dc2626" stroke-width="2.5"/>
  </g>

  <!-- Typography -->
  <text x="200" y="275" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">IMAGE PLACEHOLDER</text>
  <text x="200" y="296" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8" letter-spacing="0.5">Madras Beef Belly</text>
</svg>
